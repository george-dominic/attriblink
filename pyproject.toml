[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attriblink"
version = "0.1.2"
description = "Multi-period attribution linking for portfolio returns"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "George Dominic", email = "georgedominicv@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "build>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=attriblink --cov-report=term-missing"

[tool.hatch.build.targets.wheel]
packages = ["attriblink"]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
]
